<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 50 450 440" width="450" height="440" role="img" aria-label="Venn diagram showing design at the overlap of business needs, user needs and technical constraints">
  <g fill-opacity="0.16">
    <circle cx="225" cy="205" r="140" fill="#4C7DF0"/>
    <circle cx="375" cy="205" r="140" fill="#E8823C"/>
    <circle cx="300" cy="335" r="140" fill="#3FA46A"/>
  </g>
  <g fill="none" stroke-width="2" stroke-opacity="0.6">
    <circle cx="225" cy="205" r="140" stroke="#4C7DF0"/>
    <circle cx="375" cy="205" r="140" stroke="#E8823C"/>
    <circle cx="300" cy="335" r="140" stroke="#3FA46A"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="178" y="178" font-size="21" font-weight="600" fill="#3B6FE0">Business</text>
    <text x="178" y="201" font-size="14" fill="#57606A">needs</text>
    <text x="422" y="178" font-size="21" font-weight="600" fill="#D2731F">Users</text>
    <text x="422" y="201" font-size="14" fill="#57606A">needs</text>
    <text x="300" y="396" font-size="21" font-weight="600" fill="#2F9160">Technical</text>
    <text x="300" y="419" font-size="14" fill="#57606A">constraints</text>
    <text x="300" y="253" font-size="24" font-weight="700" letter-spacing="1.5" fill="#11161C">DESIGN</text>
  </g>
</svg>
